[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "floating-link-dock"
version = "1.0.0"
description = "A lightweight Windows floating dock for frequently used links"
requires-python = ">=3.11"
dependencies = [
  "customtkinter==5.2.2",
  "Pillow==11.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
