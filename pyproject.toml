[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "floating-link-dock"
version = "1.2.0"
description = "A lightweight Windows and macOS floating dock for frequently used links"
requires-python = ">=3.11"
dependencies = [
  "customtkinter==5.2.2",
  "Pillow==12.3.0",
  "pystray==0.19.5",
  "pyobjc-core==12.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa==12.0; sys_platform == 'darwin'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --basetemp=.test-tmp"
